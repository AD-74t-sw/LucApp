# Everything runs in containers; the host only needs Docker. Use the Makefile.
#
#   make supabase-start  -> local Supabase stack (Postgres, Auth, Studio, Mailpit…)
#   make up              -> Next.js dev server on http://localhost:3100
#   make prod            -> production image against Supabase Cloud (.env.production) on :3101
#
# Host ports (3100/3101, Supabase on 563xx) avoid the defaults (3000, 543xx) used by
# other local projects; inside the containers the app still listens on 3000.

name: lucapp

services:
  # Next.js development container: source is bind-mounted, dependencies live in
  # named volumes. It reaches the local Supabase stack through the host ports.
  app:
    build:
      context: .
      target: dev
    env_file: .env
    ports:
      - "127.0.0.1:3100:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        # "app" is an HSTS-preloaded TLD in browsers, so e2e uses this alias.
        aliases: [devserver]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - pnpm_home:/pnpm

  # Supabase CLI. It talks to the Docker daemon to start the Supabase containers,
  # so the project is mounted at the same absolute path it has on the host.
  supabase:
    profiles: [tools]
    build:
      context: .
      target: supabase-cli
    working_dir: ${HOST_PROJECT_DIR:-/app}
    environment:
      SUPABASE_TELEMETRY_DISABLED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOST_PROJECT_DIR:-.}:${HOST_PROJECT_DIR:-/app}
      - node_modules:${HOST_PROJECT_DIR:-/app}/node_modules
      - pnpm_home:/pnpm
      - /var/run/docker.sock:/var/run/docker.sock

  # End-to-end tests with the official Playwright image (browsers included).
  e2e:
    profiles: [tools]
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    working_dir: /app
    environment:
      E2E_BASE_URL: http://devserver:3000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    entrypoint: ["node", "node_modules/@playwright/test/cli.js", "test"]
    depends_on:
      - app

  # --- production-like stack (profile "prod"), configured by .env.production ---
  migrate:
    profiles: [prod]
    build:
      context: .
      target: migrator
    env_file: .env.production

  web:
    profiles: [prod]
    build:
      context: .
      target: runner
    env_file: .env.production
    ports:
      - "127.0.0.1:3101:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  node_modules:
  next_cache:
  pnpm_home:
