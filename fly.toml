# Fly.io deployment of the production image (Dockerfile target "runner").
# Environment variables and secrets are set in Fly, not here: see
# .env.production.example for the list.

# Must match the app name chosen in Fly.
app = "lucapp"
# São Paulo, next to the Supabase project (sa-east-1).
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"
  build-target = "runner"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: the in-process scheduler sends the meal reminders every minute.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/login"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
