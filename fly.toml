# fly.toml app configuration file generated for lucapp on 2026-11-18T04:14:40Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'lucapp'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'runner'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/login'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
